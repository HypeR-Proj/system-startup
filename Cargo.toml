bin = [{name = "hyper-system-startup", path = "src/main.rs", test = false, bench = false}]

[package]
name = "hyper-system-startup"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/system-startup"
publish = false
autotests = false
workspace = "../../app"

[features]
default = ["shared"]
shared = ["dep:hyper-vm-policy-shared"]

[dependencies]

[dependencies.hyper-os]
workspace = true

[dependencies.hyper-rt]
workspace = true
features = ["std"]

[dependencies.hyper-service]
workspace = true

[dependencies.hyper-journal]
workspace = true

[dependencies.hyper-component]
workspace = true

[dependencies.hyper-component-config]
workspace = true

[dependencies.hyper-bootstrap-handoff]
workspace = true

[dependencies.hyper-service-ipc]
workspace = true

[dependencies.hyper-vm-policy]
workspace = true

[dependencies.serde]
workspace = true
features = ["derive"]

[dependencies.serde_json]
workspace = true

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(target_os, values(\"hyper\"))"]

[target]

[target."cfg(target_os = \"hyper\")"]

[target."cfg(target_os = \"hyper\")".dependencies]

[target."cfg(target_os = \"hyper\")".dependencies.hyper-vm-policy-shared]
workspace = true
optional = true
