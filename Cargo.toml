[package]
workspace = "../../app"
name = "hyper-system-startup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "hyper-system-startup"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["shared"]
shared = ["dep:hyper-vm-policy-shared"]

[dependencies]
hyper-os.workspace = true
hyper-rt.workspace = true
hyper-service.workspace = true
hyper-journal.workspace = true
hyper-component.workspace = true
hyper-component-config.workspace = true
hyper-bootstrap-handoff.workspace = true
hyper-service-ipc.workspace = true
hyper-vm-policy.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "hyper")'.dependencies]
hyper-vm-policy-shared = { workspace = true, optional = true }
